name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compiler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import llvmlite.binding as llvm; print('llvmlite LLVM', llvm.llvm_version_info)"

      - name: Run test suite
        run: python tests/run_tests.py

      - name: Run test suite with AddressSanitizer + LeakSanitizer
        env:
          PSD_SANITIZE: "1"
        run: python tests/run_tests.py

      - name: Build and run all examples
        run: |
          for f in examples/*.psd; do
            if [ "$f" = "examples/webapp.psd" ]; then
              echo "=== $f === (serves forever; covered by the server integration test)"
              continue
            fi
            echo "=== $f ==="
            python -m psd run "$f"
          done

      - name: Benchmark smoke run
        run: python bench/run_bench.py --quick

      - name: Emit LLVM IR as an artifact sanity check
        run: |
          python -m psd emit-llvm examples/hello.psd -o hello.ll
          head -5 hello.ll
